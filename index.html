<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171715">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal9 Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Signal9 Social Studio</title>
<style>
:root{--bg:#171715;--panel:#20201d;--panel2:#292820;--line:#3b392f;--text:#eee9dc;--muted:#aaa596;--gold:#c3a66a;--gold2:#e0c58a;--green:#9eaf91;--red:#c88778;--r:18px}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(ellipse at 88% -8%,#393326 0,transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:940px;margin:auto;padding:0 17px}
header{padding:calc(19px + env(safe-area-inset-top)) 2px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.brand small{display:block;letter-spacing:.24em;color:var(--gold);font-size:9px;font-weight:750}.brand strong{display:block;font:400 23px Georgia,serif;margin-top:4px}.date{font-size:10px;color:var(--muted);text-align:right;line-height:1.6}
main{padding:22px 0 34px}.eyebrow{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);font-weight:750}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.025em}h1{font-size:32px;line-height:1.1;margin:9px 0 8px}h2{font-size:23px;margin:0}h3{font-size:14px;margin:0 0 8px}p{margin-top:0}.sub{font-size:13px;color:var(--muted);line-height:1.55}
.hero{background:linear-gradient(135deg,#302c22,#22221e 68%);border:1px solid #5a4d35;border-radius:22px;padding:22px;position:relative;overflow:hidden;margin-bottom:17px}.hero:after{content:"S9";position:absolute;right:8px;bottom:-35px;font:130px Georgia,serif;color:var(--gold);opacity:.08;pointer-events:none}.hero p{max-width:560px;color:#c9c2b2;font-size:13px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(155deg,#24231f,#1e1e1b 72%);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:0 8px 24px #00000012}.stat{font:29px Georgia,serif;color:var(--gold2);margin:6px 0 2px}.statlabel{font-size:11px;color:var(--muted)}
.section{margin:23px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.btn{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 13px;font-size:12px;font-weight:650;min-height:41px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#1c1a15}.btn.ghost{background:transparent;color:var(--gold2);border-color:#695b40}.btn.small{padding:7px 10px;min-height:34px;font-size:11px}.btn.danger{color:var(--red)}.btn:active{transform:scale(.985)}.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}details{border:1px solid var(--line);border-radius:13px;padding:12px;background:#1b1b18;margin:12px 0}summary{font-size:12px;color:var(--gold2);cursor:pointer;font-weight:650}details[open] summary{margin-bottom:10px}.taskrow{display:flex;align-items:flex-start;gap:10px}.taskrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);margin:1px 0 0}.taskcomplete .itemtitle{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;color:var(--muted);gap:5px}.pill.gold{border-color:#65583d;color:var(--gold2);background:#302a1d}
.list{display:grid;gap:9px}.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:11px;align-items:flex-start;min-width:0}.itemmain{min-width:0;flex:1}.itemtitle{font-size:13px;font-weight:680;margin-bottom:4px;overflow-wrap:anywhere}.itemmeta{font-size:11px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:5px;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(25,25,22,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:1px}
nav button{flex:1;max-width:130px;background:none;border:0;color:var(--muted);padding:7px 1px 5px;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:4px}nav button span{font-size:18px;line-height:1}nav button.active{color:var(--gold2)}
.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:10px;color:var(--muted);letter-spacing:.06em;font-weight:650}
input,textarea,select{width:100%;background:#171714;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:11px;font-size:14px;outline:none;min-width:0}input:focus,textarea:focus,select:focus{border-color:var(--gold)}textarea{min-height:105px;resize:vertical;line-height:1.5}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.empty{padding:23px 14px;text-align:center;border:1px dashed #514b3d;border-radius:15px;color:var(--muted);font-size:12px;line-height:1.6}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin:12px 0}.tabs button{white-space:nowrap}
.idea{background:linear-gradient(140deg,#29271f,#20201d);border:1px solid #4b4434;border-radius:16px;padding:16px}.idea p{font:17px/1.45 Georgia,serif;margin:8px 0 13px}
.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:52px;background:#20201d;border:1px solid #35342d;border-radius:9px;padding:5px;font-size:10px;color:var(--muted)}.day.today{border-color:var(--gold)}.day .count{display:block;color:var(--gold2);font-size:9px;margin-top:5px}.dayname{text-align:center;color:var(--muted);font-size:9px;padding:5px 0}
.note{font-size:11px;color:var(--muted);line-height:1.55}.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:15px 0}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none;background:#151512}.preview{max-width:100%;max-height:240px;object-fit:contain;border-radius:12px;border:1px solid var(--line);margin-top:7px}
.toast{position:fixed;bottom:calc(91px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--gold2);color:#201d16;padding:10px 15px;border-radius:99px;font-size:12px;font-weight:700;z-index:30;box-shadow:0 6px 25px #0008;max-width:90%;text-align:center}
.metricbar{height:7px;background:#39382f;border-radius:99px;overflow:hidden}.metricbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.dashcols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.hero{padding:29px}.hero h1{font-size:40px}}
@media(max-width:360px){.app{padding:0 12px}h1{font-size:28px}.card{padding:12px}.formgrid{grid-template-columns:1fr}nav button{font-size:8px}}
</style>
</head>
<body>
<div class="app"><header><div class="brand"><small>SIGNAL9 STUDIOS</small><strong>Social Studio</strong></div><div class="date" id="dateLabel"></div></header><main id="view"></main></div>
<nav id="nav">
<button data-view="home" class="active"><span>⌂</span>Home</button>
<button data-view="content"><span>✎</span>Content</button>
<button data-view="planner"><span>▦</span>Planner</button>
<button data-view="ideas"><span>✧</span>Ideas</button>
<button data-view="insights"><span>↗</span>Insights</button>
<button data-view="more"><span>•••</span>More</button>
</nav><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{
'use strict';
const DB='signal9-social-studio',STORE='records';let db,viewName='home',editId=null,month=new Date(),activeIdea='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'No date';
const platforms=['Facebook','Instagram','TikTok'];
const prompts=[
['Artwork reveal','Introduce a recent artwork. Focus on one detail, feeling or visual decision that makes it distinctive.'],
['Behind the image','Share one decision that shaped the work: composition, colour, lighting, texture or inspiration.'],
['Studio note','Give followers a glimpse into the creative process, from first concept to final print.'],
['Ask the audience','Ask which detail people noticed first, or what feeling the image brings to mind.'],
['Collection story','Explain the thread connecting several works without giving away the whole story.'],
['Print spotlight','Show how an artwork translates into a physical print. Mention paper, finish and available sizes.'],
['Creative thought','Share a short observation about photography, art, imagination or looking twice.'],
['Then and now','Compare an early concept with the finished artwork and explain what changed.'],
['Detail study','Crop into one small part of an image and invite people to discover the larger work.'],
['Weekend inspiration','Pair an artwork with a brief reflection or question suited to a slower weekend scroll.'],
['Studio favourite','Choose a personal favourite and tell followers why it matters to you.'],
['New collection teaser','Offer a subtle preview of a new direction, visual theme or upcoming body of work.'],
['Customer experience','Explain what makes a physical print special: scale, paper, finish and presentation.'],
['Creative challenge','Invite followers to interpret an image in their own words.'],
['Archive revisit','Bring an older artwork back into view and share what you think of it now.'],
['A question of process','Explain why you chose realism, abstraction, unusual colour or a particular perspective.'],
['One image, three details','Highlight three small details that reward a closer look.'],
['The story behind the title','Explain how an artwork received its title and what it adds to the viewer’s experience.']
];
const hashtagSets=[
{name:'Signal9 Core',tags:'#Signal9Studios #DigitalArt #ContemporaryArt #FineArtPrints #ArtPhotography'},
{name:'Art & Photography',tags:'#FineArtPhotography #CreativePhotography #VisualStorytelling #ArtPrint #PhotographicArt'},
{name:'Surreal & Conceptual',tags:'#SurrealArt #ConceptualArt #ContemporarySurrealism #VisualArt #ArtOfTheDay'},
{name:'Tasmania',tags:'#Tasmania #TasmaniaArtist #TasmanianArt #MadeInTasmania #DiscoverTasmania'}
];
const captionTemplates=[
{name:'Artwork introduction',text:'Introducing [ARTWORK TITLE].\n\n[Share the idea, feeling or detail behind the work.]\n\nPart of the Signal9 Studios collection.'},
{name:'Behind the artwork',text:'Every image begins with a question.\n\n[Explain the starting point and one creative decision that shaped this piece.]\n\nWhat do you notice first?'},
{name:'Print announcement',text:'Available as a fine-art print.\n\n[ARTWORK TITLE] — [SIZE / PAPER / FINISH].\n\nMessage Signal9 Studios for details.'},
{name:'Collection announcement',text:'A new collection from Signal9 Studios.\n\n[Introduce the collection theme and what connects the works.]\n\nMore to come.'},
{name:'Audience question',text:'Take a closer look.\n\n[Describe a detail without explaining it completely.]\n\nWhat does this image suggest to you?'}
];
function notify(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),2300)}
function dbOpen(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function getAll(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function save(rec){return new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite'),r=rec.id?tx.objectStore(STORE).put(rec):tx.objectStore(STORE).add(rec);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function remove(id){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(Number(id));r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function records(type){return (await getAll()).filter(x=>!type||x.type===type)}
function nav(v){viewName=v;editId=null;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)nav(b.dataset.view)});
function pill(s){return `<span class="pill ${s==='Published'?'gold':''}">${esc(s||'Idea')}</span>`}
function cardRow(title,meta,button='',img=''){return `<div class="item">${img?`<img class="thumb" src="${img}" alt="">`:'<i class="dot"></i>'}<div class="itemmain"><div class="itemtitle">${esc(title)}</div><div class="itemmeta">${meta}</div></div>${button}</div>`}
async function render(){let all=await getAll(),posts=all.filter(x=>x.type==='post'),published=posts.filter(x=>x.status==='Published'),upcoming=posts.filter(x=>x.date&&x.date>=today()&&x.status!=='Published').sort((a,b)=>a.date.localeCompare(b.date));$('#dateLabel').innerHTML=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+'<br><span style="color:var(--gold)">PERSONAL EDITION</span>';let v=$('#view');
if(viewName==='home')v.innerHTML=home(posts,published,upcoming,all);
if(viewName==='content')v.innerHTML=content(posts);
if(viewName==='planner')v.innerHTML=planner(posts);
if(viewName==='ideas')v.innerHTML=ideasPage();
if(viewName==='insights')v.innerHTML=insights(posts,published);
if(viewName==='more')v.innerHTML=morePage(all);
}
function home(posts,published,upcoming,all){let campaignCount=all.filter(x=>x.type==='campaign'&&x.status!=='Complete').length,artCount=all.filter(x=>x.type==='artwork').length;return `
<div class="hero"><div class="eyebrow">Your creative command centre</div><h1>Make your work<br>seen.</h1><p>A considered space to plan, prepare and learn from Signal9's social media. One thoughtful post at a time.</p><div class="actions"><button class="btn primary" data-act="newpost">＋ Create a post</button><button class="btn ghost" data-act="ideas">✧ Find inspiration</button></div></div>
<div class="grid"><div class="card"><div class="eyebrow">Published</div><div class="stat">${published.length}</div><div class="statlabel">Posts recorded</div></div><div class="card"><div class="eyebrow">In the pipeline</div><div class="stat">${posts.filter(p=>p.status!=='Published').length}</div><div class="statlabel">Ideas, drafts and plans</div></div><div class="card"><div class="eyebrow">Upcoming</div><div class="stat">${upcoming.length}</div><div class="statlabel">Future-dated posts</div></div><div class="card"><div class="eyebrow">Artwork library</div><div class="stat">${artCount}</div><div class="statlabel">Works catalogued</div></div></div>
<div class="dashcols"><section class="section"><div class="sectionhead"><h2>Coming up</h2><button class="btn small" data-act="goto" data-to="planner">Planner ↗</button></div>${upcoming.length?`<div class="list">${upcoming.slice(0,4).map(p=>cardRow(p.title,`${dateLabel(p.date)} · ${(p.platforms||[]).join(', ')} ${pill(p.status)}`,`<button class="btn small" data-act="edit" data-id="${p.id}">Edit</button>`)).join('')}</div>`:'<div class="empty">Nothing scheduled yet.<br>Add a date to a post and it will appear here.</div>'}
<div class="section"><div class="sectionhead"><h2>Campaigns in motion</h2><button class="btn small" data-act="campaigns">View all</button></div><div class="note">${campaignCount?campaignCount+' campaign(s) underway.':'No active campaigns yet. A collection launch or print promotion is a good place to start.'}</div></div></section>
<section class="section"><div class="sectionhead"><h2>A creative nudge</h2><button class="btn small" data-act="ideas">More ideas</button></div><div class="idea"><div class="eyebrow">Prompt of the moment</div><p>${esc(prompts[(new Date().getDate()+new Date().getMonth())%prompts.length][1])}</p><button class="btn small ghost" data-act="useprompt" data-index="${(new Date().getDate()+new Date().getMonth())%prompts.length}">Turn into a post</button></div><div class="section"><div class="sectionhead"><h2>Studio pulse</h2></div><div class="note">Keep a steady rhythm: capture ideas, prepare posts in batches, publish natively, then record what resonated.</div></div></section></div>`}
function content(posts){return `<div class="eyebrow">Content studio</div><h1>Every post starts<br>with an idea.</h1><p class="sub">Draft captions, attach artwork, choose platforms and keep your publishing history together.</p><div class="actions"><button class="btn primary" data-act="newpost">＋ New post</button><button class="btn" data-act="templates">Caption templates</button><button class="btn" data-act="hashtags">Hashtag sets</button></div><div class="tabs">${['All','Idea','Draft','Planned','Published'].map(x=>`<button class="btn small" data-filter="${x}">${x==='All'?'All posts':x}</button>`).join('')}</div><div id="postList" class="list">${posts.length?posts.sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).map(postCard).join(''):'<div class="empty">Your content library is ready.<br>Create your first post to get started.</div>'}</div>`}
function postCard(p){let img=p.image?URL.createObjectURL(p.image):'';return `<div class="item">${img?`<img class="thumb" src="${img}" alt="">`:'<i class="dot"></i>'}<div class="itemmain"><div class="itemtitle">${esc(p.title||'Untitled post')}</div><div class="itemmeta">${esc((p.platforms||[]).join(' · ')||'No platform')} · ${dateLabel(p.date)}<br>${esc((p.caption||'').slice(0,90))}${(p.caption||'').length>90?'…':''}</div><div style="margin-top:6px">${pill(p.status)}</div></div><button class="btn small" data-act="edit" data-id="${p.id}">Edit</button></div>`}
function planner(posts){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=n;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,count=posts.filter(p=>p.date===key).length;cells+=`<div class="day ${key===today()?'today':''}">${d}${count?`<span class="count">${count} post${count>1?'s':''}</span>`:''}</div>`}let keyMonth=`${y}-${String(m+1).padStart(2,'0')}`,mp=posts.filter(p=>p.date&&p.date.slice(0,7)===keyMonth).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="eyebrow">Publishing calendar</div><h1>Plan with<br>intention.</h1><p class="sub">See your planned activity and keep a healthy publishing rhythm.</p><div class="card"><div class="row between"><button class="btn small" data-act="prevmonth">‹</button><h3 class="serif" style="font-size:20px;margin:0">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button class="btn small" data-act="nextmonth">›</button></div><div class="monthgrid" style="margin-top:12px">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dayname">${x}</div>`).join('')}${cells}</div></div><div class="section"><div class="sectionhead"><h2>This month</h2><button class="btn small" data-act="newpost">＋ Add</button></div>${mp.length?`<div class="list">${mp.map(p=>cardRow(p.title,`${dateLabel(p.date)} · ${(p.platforms||[]).join(', ')} ${pill(p.status)}`,`<button class="btn small" data-act="edit" data-id="${p.id}">Edit</button>`)).join('')}</div>`:'<div class="empty">No posts dated this month yet.</div>'}</div>`}
function ideasPage(){return `<div class="eyebrow">Inspiration library</div><h1>Never start<br>with a blank page.</h1><p class="sub">A growing collection of ideas tailored to a visual creative studio.</p><div class="idea"><div class="eyebrow">Random inspiration</div><p id="randomIdea">${esc(prompts[Math.floor(Math.random()*prompts.length)][1])}</p><div class="actions"><button class="btn primary" data-act="randomidea">Surprise me ↗</button><button class="btn ghost" data-act="useidea">Make a post</button></div></div><div class="section"><div class="sectionhead"><h2>Idea shelf</h2><span class="pill">${prompts.length} prompts</span></div><div class="list">${prompts.map((p,i)=>cardRow(p[0],p[1],`<button class="btn small" data-act="useprompt" data-index="${i}">Use</button>`)).join('')}</div></div>`}
function insights(posts,published){let metrics=published.flatMap(p=>(p.metrics||[]).map(m=>({...m,title:p.title}))),sum=k=>metrics.reduce((a,m)=>a+(Number(m[k])||0),0),reach=sum('reach'),likes=sum('likes'),comments=sum('comments'),shares=sum('shares');return `<div class="eyebrow">Performance journal</div><h1>Learn what<br>resonates.</h1><p class="sub">Enter the figures shown in each social platform's own insights. This app does not connect to your accounts.</p><div class="grid"><div class="card"><div class="eyebrow">Recorded reach / views</div><div class="stat">${reach.toLocaleString()}</div><div class="statlabel">Across saved entries</div></div><div class="card"><div class="eyebrow">Interactions</div><div class="stat">${(likes+comments+shares).toLocaleString()}</div><div class="statlabel">Likes, comments and shares</div></div><div class="card"><div class="eyebrow">Posts published</div><div class="stat">${published.length}</div><div class="statlabel">In your history</div></div><div class="card"><div class="eyebrow">Tracked entries</div><div class="stat">${metrics.length}</div><div class="statlabel">Performance snapshots</div></div></div><div class="section card"><h3>Record post performance</h3>${published.length?`<form id="metricForm"><div class="field"><label>POST</label><select name="postId" required><option value="">Choose a published post</option>${published.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>PLATFORM</label><select name="platform">${platforms.map(p=>`<option>${p}</option>`).join('')}</select></div><div class="field"><label>DATE CHECKED</label><input name="date" type="date" value="${today()}"></div>${[['reach','Reach / views'],['likes','Likes'],['comments','Comments'],['shares','Shares / saves']].map(x=>`<div class="field"><label>${x[1].toUpperCase()}</label><input name="${x[0]}" type="number" min="0" placeholder="0"></div>`).join('')}</div><button class="btn primary" function morePage(all){let campaigns=all.filter(x=>x.type==='campaign'),art=all.filter(x=>x.type==='artwork');return `<div class="eyebrow">Studio resources</div><h1>Everything behind<br>the publishing.</h1><p class="sub">Campaigns, artwork catalogue, reusable copy and data protection.</p><div class="grid"><button class="card" data-act="campaigns" style="text-align:left;color:var(--text)"><div class="eyebrow">01 / Planning</div><h2 style="margin:9px 0 4px">Campaigns</h2><div class="stat">${campaigns.length}</div><div class="statlabel">Campaign records</div></button><button class="card" data-act="artworks" style="text-align:left;color:var(--text)"><div class="eyebrow">02 / Catalogue</div><h2 style="margin:9px 0 4px">Artwork library</h2><div class="stat">${art.length}</div><div class="statlabel">Works catalogued</div></button><button class="card" data-act="tasks" style="text-align:left;color:var(--text)"><div class="eyebrow">03 / Workflow</div><h2 style="margin:9px 0 4px">Marketing tasks</h2><div class="stat">＋</div><div class="statlabel">Keep the next steps moving</div></button><button class="card" data-act="templates" style="text-align:left;color:var(--text)"><div class="eyebrow">04 / Copy desk</div><h2 style="margin:9px 0 4px">Caption templates</h2><div class="stat">${captionTemplates.length}</div><div class="statlabel">Reusable starting points</div></button><button class="card" data-act="hashtags" style="text-align:left;color:var(--text)"><div class="eyebrow">05 / Discovery</div><h2 style="margin:9px 0 4px">Hashtag sets</h2><div class="stat">${hashtagSets.length}</div><div class="statlabel">Reusable collections</div></button></div><div class="section"><div class="sectionhead"><h2>Data & backup</h2><span class="pill gold">On this iPhone</span></div><div class="card"><p class="note">Your content, campaign records, artwork details and attached images are stored in this browser on this device. Export a backup regularly. Clearing Safari website data can remove local records.</p><div class="actions"><button class="btn primary" data-act="backup">Export full backup</button><label class="btn" for="restoreInput">Restore backup</label><input id="restoreInput" type="file" accept="application/json" style="display:none"></div><div class="divider"></div><div class="note">Publishing is done in Facebook, Instagram or TikTok. This app prepares and tracks your content; it does not log into accounts, auto-publish or retrieve live platform analytics.</div></div></div><div class="section"><div class="sectionhead"><h2>About this build</h2></div><div class="note">Signal9 Social Studio · Personal Edition · Version 3.0<br>Offline-first PWA · No account · No API keys · No subscription.</div></div>`}
function formPost(p={}){editId=p.id||null;let v=$('#view');v.innerHTML=`<div class="eyebrow">Content studio / ${p.id?'Edit post':'New post'}</div><h1>${p.id?'Refine your post.':'Create something worth sharing.'}</h1><p class="sub">Prepare your caption, attach the artwork and select the platforms you intend to use.</p><form id="postForm"><div class="field"><label>POST TITLE</label><input name="title" required maxlength="100" placeholder="e.g. Between Moments — artwork reveal" value="${esc(p.title||'')}"></div><div class="field"><label>MASTER CAPTION</label><textarea name="caption" placeholder="Write the core story behind this post…">${esc(p.caption||'')}</textarea></div><details><summary>Platform-specific caption versions</summary><p class="note">Optional: tailor the wording for each platform. Blank versions use the master caption when copied.</p><div class="field"><label>FACEBOOK VERSION</label><textarea name="captionFacebook" placeholder="More context or storytelling…">${esc((p.variants||{}).Facebook||'')}</textarea></div><div class="field"><label>INSTAGRAM VERSION</label><textarea name="captionInstagram" placeholder="A visual-first caption…">${esc((p.variants||{}).Instagram||'')}</textarea></div><div class="field"><label>TIKTOK VERSION</label><textarea name="captionTikTok" placeholder="A short hook and direct message…">${esc((p.variants||{}).TikTok||'')}</textarea></div></details><div class="field"><label>HASHTAGS</label><textarea name="hashtags" style="min-height:65px" placeholder="#Signal9Studios #DigitalArt">${esc(p.hashtags||'')}</textarea><div class="row"><button type="button" class="btn small" data-act="hashtags">Choose saved hashtag set</button><button type="button" class="btn small" data-act="templates">Use caption template</button></div></div><div class="field"><label>PLATFORMS</label><div class="row">${platforms.map(x=>`<label class="pill"><input type="checkbox" name="platforms" value="${x}" style="width:auto;margin:0" ${(p.platforms||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><div class="formgrid"><div class="field"><label>PUBLICATION DATE</label><input name="date" type="date" value="${esc(p.date||'')}"></div><div class="field"><label>STATUS</label><select name="status">${['Idea','Draft','Planned','Published'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>ATTACH ARTWORK IMAGE</label><input name="image" type="file" accept="image/*"><div class="note">The selected image is stored locally with this post. Large images use device storage.</div>${p.image?`<img class="preview" src="${URL.createObjectURL(p.image)}" alt="Attached artwork">`:'<div id="imagePreview"></div>'}</div><div class="actions"><button class="btn primary">Save post</button><button type="button" class="btn" data-act="copycaption">Copy master</button><button type="button" class="btn small" data-act="copyplatform" data-platform="Facebook">FB</button><button type="button" class="btn small" data-act="copyplatform" data-platform="Instagram">IG</button><button type="button" class="btn small" data-act="copyplatform" data-platform="TikTok">TikTok</button><button type="button" class="btn" data-act="cancel">Cancel</button>${p.id?'<button type="button" class="btn danger" data-act="deletepost">Delete</button>':''}</div></form>`}
function formArtwork(a={}){editId=a.id||null;$('#view').innerHTML=`<div class="eyebrow">Artwork catalogue / ${a.id?'Edit':'New entry'}</div><h1>Keep your work<br>in view.</h1><p class="sub">A local catalogue for Signal9 artwork and print details.</p><form id="artForm"><div class="field"><label>ARTWORK TITLE</label><input name="title" required value="${esc(a.title||'')}" placeholder="Artwork title"></div><div class="formgrid"><div class="field"><label>COLLECTION</label><input name="collection" value="${esc(a.collection||'')}" placeholder="Collection name"></div><div class="field"><label>STATUS</label><select name="status">${['Concept','In progress','Finished','For sale','Archived'].map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>DESCRIPTION / STORY</label><textarea name="description">${esc(a.description||'')}</textarea></div><div class="formgrid"><div class="field"><label>PRINT SIZE</label><input name="size" value="${esc(a.size||'')}" placeholder="A3, A2…"></div><div class="field"><label>PRICE (OPTIONAL)</label><input name="price" value="${esc(a.price||'')}" placeholder="$"></div></div><div class="field"><label>ARTWORK IMAGE</label><input name="image" type="file" accept="image/*">${a.image?`<img class="preview" src="${URL.createObjectURL(a.image)}" alt="Artwork">`:''}</div><div class="actions"><button class="btn primary">Save artwork</button><button type="button" class="btn" data-act="cancel">Cancel</button>${a.id?'<button type="button" class="btn danger" data-act="deleteart">Delete</button>':''}</div></form>`}

function templatesPage(){let list=captionTemplates.map((x,i)=>cardRow(x.name,esc(x.text).replace(/\n/g,'<br>'),`<button class="btn small" data-act="usetemplate" data-index="${i}">Use</button>`)).join('');$('#view').innerHTML=`<div class="eyebrow">Copy desk</div><h1>Start with a<br>strong foundation.</h1><p class="sub">Reusable caption structures. Personalise the placeholders before publishing.</p><div class="list">${list}</div>`}
function hashtagsPage(){let list=hashtagSets.map((x,i)=>cardRow(x.name,esc(x.tags),`<button class="btn small" data-act="copytags" data-index="${i}">Copy</button>`)).join('');$('#view').innerHTML=`<div class="eyebrow">Hashtag library</div><h1>Keep your tags<br>close at hand.</h1><p class="sub">Copy a set and tailor it to the artwork and audience. These are starting points, not guaranteed reach boosters.</p><div class="list">${list}</div>`}
async function backup(){let data=await getAll();let rows=[];for(let r of data){let o={...r};if(r.image){o.imageData=await blobToData(r.image);delete o.image}rows.push(o)}let blob=new Blob([JSON.stringify({app:'Signal9 Social Studio',version:2,exported:new Date().toISOString(),records:rows},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='signal9-social-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Full backup exported')}
function blobToData(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function dataToBlob(data){let [head,b64]=data.split(','),mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg',bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
async function restore(file){try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.records))throw Error('bad');if(!confirm('Restore this backup? Records with matching IDs will be replaced; other existing records will remain.'))return;for(let r of obj.records){if(r.imageData){r.image=dataToBlob(r.imageData);delete r.imageData}await save(r)}notify('Backup restored');nav('home')}catch(e){alert('Could not restore this file. Please choose a valid Signal9 Social Studio backup.')}}
function copy(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>notify('Copied')).catch(()=>notify('Copy unavailable in this browser'));else notify('Clipboard unavailable in this browser')}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;
if(a==='ideas')nav('ideas');if(a==='goto')nav(b.dataset.to);if(a==='newpost')formPost();if(a==='cancel')nav('content');
if(a==='edit'){let r=(await getAll()).find(x=>x.id===Number(b.dataset.id));if(r)formPost(r)}
if(a==='deletepost'&&editId&&confirm('Delete this post?')){await remove(editId);notify('Post deleted');nav('content')}
if(a==='prevmonth'){month.setMonth(month.getMonth()-1);render()}if(a==='nextmonth'){month.setMonth(month.getMonth()+1);render()}

if(a==='useidea')formPost({title:'Social post idea',caption:$('#randomIdea').textContent,status:'Draft'});
if(a==='copycaption'){let f=$('#postForm');if(f)copy(f.elements.caption.value+(f.elements.hashtags.value?'\n\n'+f.elements.hashtags.value:''))}if(a==='copyplatform'){let f=$('#postForm');if(f){let p=b.dataset.platform,k=p==='Facebook'?'captionFacebook':p==='Instagram'?'captionInstagram':'captionTikTok',t=f.elements[k].value.trim()||f.elements.caption.value;copy(t+(f.elements.hashtags.value?'\n\n'+f.elements.hashtags.value:''))}}
if(a==='templates')templatesPage();if(a==='hashtags')hashtagsPage();if(a==='usetemplate'){let t=captionTemplates[Number(b.dataset.index)];formPost({title:t.name,caption:t.text,status:'Draft'})}
if(a==='copytags')copy(hashtagSets[Number(b.dataset.index)].tags);
if(a==='tasks')tasksPage();if(a==='newtask')formTask();if(a==='edittask'){let t=(await records('task')).find(x=>x.id===Number(b.dataset.id));if(t)formTask(t)}if(a==='toggleTask'){let t=(await records('task')).find(x=>x.id===Number(b.dataset.id));if(t){t.done=b.checked;await save(t);tasksPage()}}if(a==='deletetask'&&editId&&confirm('Delete this task?')){await remove(editId);notify('Task deleted');tasksPage()}
if(a==='campaigns')campaignsPage();if(a==='newcampaign')formCampaign();if(a==='editcampaign'){let c=(await records('campaign')).find(x=>x.id===Number(b.dataset.id));if(c)formCampaign(c)}
if(a==='deletecampaign'&&editId&&confirm('Delete this campaign?')){await remove(editId);notify('Campaign deleted');campaignsPage()}
if(a==='artworks')artworksPage();if(a==='newart')formArtwork();if(a==='editart'){let x=(await records('artwork')).find(x=>x.id===Number(b.dataset.id));if(x)formArtwork(x)}

if(a==='backup')backup();
if(a==='filter'){document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('primary',x===b));let f=b.dataset.filter,p=(await records('post')).filter(x=>f==='All'||x.status===f);$('#postList').innerHTML=p.length?p.map(postCard).join(''):'<div class="empty">No posts in this view.</div>'}
});

async function tasksPage(){
 let tasks=await records('task');
 tasks.sort((a,b)=>(a.done===b.done?String(a.due||'9999').localeCompare(String(b.due||'9999')):(a.done?1:-1)));
 let open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
 $('#view').innerHTML=`<div class="eyebrow">Marketing workflow</div><h1>Small steps.<br>Consistent momentum.</h1><p class="sub">A private checklist for the practical work behind your social presence.</p><button class="btn primary" data-act="newtask">＋ Add a task</button><div class="section"><div class="sectionhead"><h2>To do</h2><span class="pill gold">${open.length} open</span></div>${open.length?`<div class="list">${open.map(t=>taskCard(t)).join('')}</div>`:'<div class="empty">Nothing waiting. Enjoy the breathing room — or add the next useful step.</div>'}</div><div class="section"><div class="sectionhead"><h2>Completed</h2><span class="pill">${done.length}</span></div>${done.length?`<div class="list">${done.map(t=>taskCard(t)).join('')}</div>`:'<div class="empty">Completed tasks will collect here.</div>'}</div>`;
}
